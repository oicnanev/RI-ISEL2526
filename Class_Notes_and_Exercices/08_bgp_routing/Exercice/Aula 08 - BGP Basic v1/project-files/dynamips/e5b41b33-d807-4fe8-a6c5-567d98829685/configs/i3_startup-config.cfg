!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Router-Lisboa2
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 ip address 156.100.1.1 255.255.255.0
!
interface Loopback1
 ip address 156.100.2.1 255.255.255.0
!
interface Loopback2
 ip address 156.100.4.1 255.255.255.0
!
interface FastEthernet0/0
 ip address 10.10.3.2 255.255.255.0
 duplex half
!
interface FastEthernet1/0
 ip address 192.168.3.1 255.255.255.0
 duplex half
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet2/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
!
interface Serial4/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial4/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial4/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial4/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface Ethernet5/0
 no ip address
 shutdown
 duplex half
!
interface Ethernet5/1
 no ip address
 shutdown
 duplex half
!
interface Ethernet5/2
 no ip address
 shutdown
 duplex half
!
interface Ethernet5/3
 no ip address
 shutdown
 duplex half
!
interface Ethernet6/0
 no ip address
 shutdown
 duplex half
!
interface Ethernet6/1
 no ip address
 shutdown
 duplex half
!
interface Ethernet6/2
 no ip address
 shutdown
 duplex half
!
interface Ethernet6/3
 no ip address
 shutdown
 duplex half
!
interface Ethernet6/4
 no ip address
 shutdown
 duplex half
!
interface Ethernet6/5
 no ip address
 shutdown
 duplex half
!
interface Ethernet6/6
 no ip address
 shutdown
 duplex half
!
interface Ethernet6/7
 no ip address
 shutdown
 duplex half
!
router bgp 10000
 no synchronization
 bgp log-neighbor-changes
 network 10.10.3.0 mask 255.255.255.0
 network 156.100.1.0 mask 255.255.255.0
 network 156.100.2.0 mask 255.255.255.0
 network 156.100.4.0 mask 255.255.255.0
 network 192.168.3.0
 neighbor 10.10.3.1 remote-as 65000
 neighbor 192.168.3.2 remote-as 10000
 no auto-summary
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
