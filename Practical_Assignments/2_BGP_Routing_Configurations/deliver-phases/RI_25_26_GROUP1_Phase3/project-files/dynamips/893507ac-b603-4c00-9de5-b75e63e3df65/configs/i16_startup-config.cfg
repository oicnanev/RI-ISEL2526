!
! ==============================================================================
!                 AS 1 - Level 3 Parent, LLC - BADGUY
! ==============================================================================
hostname BadGuy
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.66.66.66 255.255.255.255
!
interface GigabitEthernet4/0
 ip address 211.176.129.6 255.255.255.252
 no shutdown
!
! ==============================================================================
!                                   BGP
! ==============================================================================
!
router bgp 1
 bgp router-id 10.66.66.66
 no synchronization
 bgp log-neighbor-changes
 !
 ! eBGP -------------------------------
 neighbor 211.176.129.5 remote-as 4637                 
 neighbor 211.176.129.5 soft-reconfiguration inbound
 neighbor 211.176.129.5 maximum-prefix 50
 no auto-summary
end
