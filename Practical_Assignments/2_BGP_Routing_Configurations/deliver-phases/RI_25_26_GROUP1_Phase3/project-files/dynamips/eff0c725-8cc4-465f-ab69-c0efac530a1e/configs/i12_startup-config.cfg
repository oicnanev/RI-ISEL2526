!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R12
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 ip address 10.12.12.12 255.255.255.255
!
interface Loopback1
 ip address 46.87.162.112 255.255.255.255
!
interface FastEthernet0/0
 ip address 46.87.162.2 255.255.255.252
 duplex half
!
interface GigabitEthernet1/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 10.11.12.2 255.255.255.252
 negotiation auto
!
interface GigabitEthernet3/0
 ip address 10.10.12.2 255.255.255.252
 negotiation auto
!
interface GigabitEthernet4/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet5/0
 ip address 48.73.240.18 255.255.255.252
 negotiation auto
!
router ospf 1
 router-id 10.12.12.12
 log-adjacency-changes
 area 1 stub no-summary
 network 10.10.12.0 0.0.0.3 area 1
 network 10.11.12.0 0.0.0.3 area 1
 network 10.12.12.12 0.0.0.0 area 1
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
