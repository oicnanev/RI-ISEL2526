!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R8
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 ip address 10.8.8.8 255.255.255.255
!
interface Loopback1
 ip address 130.41.46.88 255.255.255.255
!
interface FastEthernet0/0
 ip address 130.41.46.5 255.255.255.252
 duplex half
!
interface GigabitEthernet1/0
 ip address 10.7.8.2 255.255.255.252
 negotiation auto
!
interface GigabitEthernet2/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet4/0
 ip address 48.73.240.2 255.255.255.252
 negotiation auto
!
interface GigabitEthernet5/0
 ip address 130.41.46.2 255.255.255.252
 negotiation auto
!
router ospf 1
 router-id 10.8.8.8
 log-adjacency-changes
 network 10.7.8.0 0.0.0.3 area 0
 network 10.8.8.8 0.0.0.0 area 0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
