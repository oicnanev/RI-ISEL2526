!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R15
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 ip address 10.15.15.15 255.255.255.255
!
interface Loopback1
 ip address 211.176.128.115 255.255.255.255
!
interface FastEthernet0/0
 ip address 211.176.128.2 255.255.255.252
 duplex half
!
interface GigabitEthernet1/0
 ip address 48.73.240.14 255.255.255.252
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 211.176.129.1 255.255.255.252
 negotiation auto
!
interface GigabitEthernet3/0
 ip address 64.112.0.10 255.255.255.252
 negotiation auto
!
interface GigabitEthernet4/0
 ip address 211.176.129.5 255.255.255.252
 negotiation auto
!
interface GigabitEthernet5/0
 no ip address
 shutdown
 negotiation auto
!
router bgp 4637
 no synchronization
 bgp router-id 10.15.15.15
 bgp log-neighbor-changes
 neighbor 210.176.129.6 remote-as 1
 neighbor 210.176.129.6 soft-reconfiguration inbound
 no auto-summary
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
