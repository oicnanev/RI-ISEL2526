!
!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R7
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
ip cef
!
!
!
!
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.7.7.7 255.255.255.255
!
interface Loopback1
 ip address 130.41.46.77 255.255.255.255
!
interface FastEthernet0/0
 ip address 130.41.46.9 255.255.255.252
 duplex half
!
interface GigabitEthernet1/0
 ip address 10.7.8.1 255.255.255.252
 negotiation auto
!
interface GigabitEthernet2/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet4/0
 ip address 48.73.240.6 255.255.255.252
 negotiation auto
!
interface GigabitEthernet5/0
 ip address 64.112.0.6 255.255.255.252
 negotiation auto
!
router ospf 1
 router-id 10.7.7.7
 log-adjacency-changes
 passive-interface default
 no passive-interface GigabitEthernet1/0
 network 10.7.7.7 0.0.0.0 area 0
 network 10.7.8.1 0.0.0.0 area 0
 network 48.73.240.4 0.0.0.3 area 0
 network 64.112.0.4 0.0.0.3 area 0
 network 130.41.46.8 0.0.0.3 area 0
 network 130.41.46.77 0.0.0.0 area 0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
