!
!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R12
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
ip cef
!
!
!
!
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.12.12.12 255.255.255.255
!
interface Loopback1
 ip address 46.87.162.112 255.255.255.255
!
interface FastEthernet0/0
 ip address 46.87.162.2 255.255.255.252
 duplex half
!
interface GigabitEthernet1/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 10.11.12.2 255.255.255.252
 negotiation auto
!
interface GigabitEthernet3/0
 ip address 10.10.12.2 255.255.255.252
 negotiation auto
!
interface GigabitEthernet4/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet5/0
 no ip address
 shutdown
 negotiation auto
!
router ospf 1
 router-id 10.12.12.12
 log-adjacency-changes
 area 1 stub
 passive-interface default
 no passive-interface GigabitEthernet2/0
 no passive-interface GigabitEthernet3/0
 network 10.10.12.2 0.0.0.0 area 0
 network 10.11.12.2 0.0.0.0 area 0
 network 10.12.12.12 0.0.0.0 area 0
 network 46.87.162.0 0.0.0.3 area 1
 network 46.87.162.112 0.0.0.0 area 1
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
