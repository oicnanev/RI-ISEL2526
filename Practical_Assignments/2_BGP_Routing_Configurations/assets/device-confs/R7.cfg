! ==============================================================================
!
!                              AS 17390 - IBM - R7
!
! ==============================================================================
!
hostname R7
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.7.7.7 255.255.255.255
!
interface Loopback1
 ip address 130.41.46.77 255.255.255.255
!
interface fastEthernet0/0
 ip address 130.41.46.9 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 ip address 10.7.8.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet4/0
 ip address 48.73.240.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet5/0
 ip address 64.112.0.6 255.255.255.252
 no shutdown
!
! ==============================================================================
!                                    OSPF
! ==============================================================================
!
router ospf 1
 router-id 10.7.7.7
 passive-interface default               ! block all interfaces from talk OSPF
 network 10.7.7.7 0.0.0.0 area 0         ! Lo0
 network 130.41.46.77 0.0.0.0 area 0     ! Lo1
 network 130.41.46.9 0.0.0.3 area 0      ! fa0/0 - Route to AS 64513 (private)
 network 10.7.8.1 0.0.0.0 area 0         ! g1/0 -> R8
 network 48.73.240.6 0.0.0.3 area 0      ! g4/0 - Route to AS 1273
 network 64.112.0.6 0.0.0.3 area 0       ! g5/0 - Route to AS 701
 no passive-interface GigabitEthernet1/0 ! unlock to talk OSPF
!
! ==============================================================================
!                                   BGP
! ==============================================================================
!
router bgp 17390
 no synchronization
 bgp log-neighbor-changes
 ! iBGP -------------------------------
 neighbor 10.8.8.8 remote-as 17390
 neighbor 10.8.8.8 update-source Loopback0
 neighbor 10.8.8.8 next-hop-self
 neighbor 10.8.8.8 soft-reconfiguration-inbound
 ! eBGP -------------------------------
 neighbor 64.96.0.114 remote-as 701
 neighbor 64.96.0.114 soft-reconfiguration-inbound
 no auto-summary
 neighbor 130.41.47.99 remote-as 64513
 neighbor 130.41.47.99 soft-reconfiguration-inbound
 no auto-summary
 neighbor 48.73.239.33 remote-as 1273
 neighbor 48.73.239.33 soft-reconfiguration-inbound
 no auto-summary
!
end
