! ==============================================================================
!
!                          AS 23344 - Disney - R13
!
! ==============================================================================
!
hostname R13
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.13.13.13 255.255.255.255
!
interface Loopback1
 ip address 158.23.228.113 255.255.255.255
!
interface fastEthernet0/0
 ip address 46.88.20.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 ip address 158.23.228.2 255.255.255.252
 no shutdown
!
! ==============================================================================
!                               STATIC ROUTES
! ==============================================================================
!
ip route 158.23.228.0 255.255.255.0 Null0
! 
! ==============================================================================
!                                   BGP
! ==============================================================================
!
router bgp 23344
 bgp router-id 10.13.13.13
 no synchronization
 bgp log-neighbor-changes
 !
 ! eBGP -------------------------------
 neighbor 46.88.20.5 remote-as 5511                 
 neighbor 46.88.20.5 soft-reconfiguration inbound
 !
 ! Advertise Routes -------------------
 network 158.23.228.113 mask 255.255.255.255    ! Lo1
 network 158.23.228.0 mask 255.255.255.0
 network 158.23.228.0 mask 255.255.255.252      ! avoid black-hole / access server6
 no auto-summary
end 
