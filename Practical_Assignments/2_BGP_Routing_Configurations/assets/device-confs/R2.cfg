! ==============================================================================
!
!                          AS 1273 - Vodafone - R2
!
! ==============================================================================
!
hostname R2
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.2.2.2 255.255.255.255
!
interface Loopback1
 ip address 48.73.239.22 255.255.255.255
!
interface fastEthernet0/0
 ip address 48.73.239.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 ip address 10.1.2.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 ip address 10.2.4.1 255.255.255.252
 no shutdown
!
! ==============================================================================
!                                  OSPF
! ==============================================================================
!
router ospf 1
 router-id 10.2.2.2
 passive-interface default                 ! block all interfaces from talk OSPF
 network 10.2.2.2 0.0.0.0 area 0           ! Lo0
 network 48.73.239.22 0.0.0.0 area 0       ! Lo1
 network 48.73.239.2 0.0.0.3 area 0        ! fa0/0 - route to AS 20717
 network 10.1.2.2 0.0.0.0 area 0           ! g1/0 -> R1
 network 10.2.4.1 0.0.0.0 area 0           ! g2/0 -> R4
 no passive-interface GigabitEthernet1/0   ! unlock OSPF on g1/0
 no passive-interface GigabitEthernet2/0   ! unlock OSPF on g2/0
!
! ==============================================================================
!                                   BGP
! ==============================================================================
!
router bgp 1273
 no synchronization
 bgp log-neighbor-changes
 ! iBGP -------------------------------
 neighbor 10.1.1.1 remote-as 1273
 neighbor 10.1.1.1 update-source Loopback0
 neighbor 10.1.1.1 next-hop-self
 neighbor 10.1.1.1 soft-reconfiguration-inbound
 neighbor 10.4.4.4 remote-as 1273
 neighbor 10.4.4.4 update-source Loopback0
 neighbor 10.4.4.4 next-hop-self
 neighbor 10.4.4.4 soft-reconfiguration-inbound
!
end
