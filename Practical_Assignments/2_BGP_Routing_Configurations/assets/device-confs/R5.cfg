! ==============================================================================
!
!                          AS 1273 - Vodafone - R5
!
! ==============================================================================
!
hostname R5
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.5.5.5 255.255.255.255
!
interface Loopback1
 ip address 48.73.239.55 255.255.255.255
!
interface GigabitEthernet1/0
 ip address 64.112.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet3/0
 ip address 10.3.5.2 255.255.255.252
 no shutdown
!
! ==============================================================================
!                                    OSPF
! ==============================================================================
!
router ospf 1
 router-id 10.5.5.5
 passive-interface default               ! block all interfaces from talk OSPF
 network 10.5.5.5 0.0.0.0 area 0         ! Lo0
 network 48.73.239.55 0.0.0.0 area 0     ! Lo1
 network 64.112.0.2 0.0.0.3 area 0       ! g1/0 - Route to AS 701
 network 10.3.5.2 0.0.0.0 area 0         ! g3/0 -> R3
 no passive-interface GigabitEthernet3/0 ! allow interface to talk OSPF
!
! ==============================================================================
!                               STATIC ROUTES
! ==============================================================================
!
ip route 48.73.239.0 255.255.255.0 Null0
ip route 48.73.240.0 255.255.252.0 Null0
ip route 63.25.64.0 255.255.192.0 Null0
! 
! ==============================================================================
!                                   BGP
! ==============================================================================
!
router bgp 1273
 no synchronization
 bgp log-neighbor-changes
 ! iBGP -------------------------------
 neighbor 10.3.3.3 remote-as 1273
 neighbor 10.3.3.3 update-source Loopback0
 neighbor 10.3.3.3 next-hop-self
 neighbor 10.3.3.3 soft-reconfiguration-inbound
 ! eBGP -------------------------------
 neighbor 64.96.0.114 remote-as 701
 neighbor 64.96.0.114 soft-reconfiguration-inbound
 ! Advertise Routes -------------------
 network 48.73.239.0 mask 255.255.255.0
 network 48.73.240.0 mask 255.255.252.0
 network 63.25.64.0 mask 255.255.292.0
 no auto-summary
!
end
