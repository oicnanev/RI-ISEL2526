! ==============================================================================
!
!                            AS 5511 - Orange - R10
!
! ==============================================================================
!
hostname R10
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.10.10.10 255.255.255.255
!
interface Loopback1
 ip address 46.87.162.110 255.255.255.255
!
interface GigabitEthernet1/0
 ip address 10.10.11.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 ip address 211.176.129.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet3/0
 ip address 10.10.12.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet4/0
 ip address 46.88.20.1 255.255.255.252
 no shutdown
!
!interface GigabitEthernet5/0
! ip address 48.73.240.18 255.255.255.252
! no shutdown
!
! ==============================================================================
!                                    OSPF
! ==============================================================================
!
router ospf 1
 router-id 10.10.10.10
 passive-interface default             ! block all interfaces from talk OSPF
 network 10.10.10.10 0.0.0.0 area 0    ! Lo0
 network 46.87.162.110 0.0.0.0 area 0  ! Lo1
 network 10.10.11.1 0.0.0.0 area 0     ! g1/0 -> R11
 network 211.176.129.2 0.0.0.3 area 0  ! g2/0 - Route to AS 4637
 network 10.10.12.1 0.0.0.0 area 1     ! g3/0 -> R12
 network 46.88.20.1 0.0.0.3 area 0     ! g4/0 - Route to AS 20717
 network 48.73.240.18 0.0.0.3 area 0   ! g5/0 - Route to IXP1 - AS1273
 area 1 stub
 ! unlock OSPF interfaces
 no passive-interface GigabitEthernet1/0
 no passive-interface GigabitEthernet3/0
!
! ==============================================================================
!                               STATIC ROUTES
! ==============================================================================
!
ip route 46.87.162.0 255.255.255.0 Null0
ip route 46.88.20.0 255.255.255.0 Null0
ip route 46.88.22.0 255.255.255.0 Null0
ip route 46.89.36.0 255.255.255.0 Null0
ip route 46.89.38.0 255.255.255.0 Null0
ip route 46.92.2.0 255.255.255.0 Null0
!
! ==============================================================================
!                                   BGP
! ==============================================================================
!
!
router bgp 5511
 no synchronization
 bgp log-neighbor-changes
 ! iBGP -------------------------------
 neighbor 10.11.11.11 remote-as 5511
 neighbor 10.11.11.11 update-source Loopback0
 neighbor 10.11.11.11 next-hop-self
 neighbor 10.11.11.11 soft-reconfiguration-inbound
 neighbor 10.11.11.12 remote-as 5511
 neighbor 10.11.11.12 update-source Loopback0
 neighbor 10.11.11.12 next-hop-self
 neighbor 10.11.11.12 soft-reconfiguration-inbound
 ! eBGP -------------------------------
 neighbor 46.88.20.2 remote-as 20717                 !  nao tem Lo1
 neighbor 46.88.20.2 soft-reconfiguration-inbound
 no auto-summary
 neighbor 48.73.239.66 remote-as 1273
 neighbor 48.73.239.66 soft-reconfiguration-inbound
 no auto-summary
 neighbor 211.176.28.115 remote-as 4637
 neighbor 211.176.28.115 soft-reconfiguration-inbound
 no auto-summary
!
end
