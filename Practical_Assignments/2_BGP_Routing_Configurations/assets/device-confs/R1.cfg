! ==============================================================================
!
!                          AS 1273 - Vodafone - R1
!
! ==============================================================================
!
hostname R1
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.1.1.1 255.255.255.255
!
interface Loopback1
 ip address 48.73.239.11 255.255.255.255
!
interface GigabitEthernet1/0
 ip address 10.1.2.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 ip address 10.1.3.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet3/0
 ip address 48.73.240.1 255.255.255.252
 no shutdown
!
! ==============================================================================
!                                  OSPF
! ==============================================================================
!
router ospf 1
 router-id 10.1.1.1
 passive-interface default                 ! block all interfaces from talk OSPF
 network 10.1.1.1 0.0.0.0 area 0           ! Lo0
 network 48.73.239.11 0.0.0.0 area 0       ! Lo1
 network 10.1.2.1 0.0.0.0 area 0           ! g1/0 -> R2
 network 10.1.3.1 0.0.0.0 area 0           ! g2/0 -> R3
 network 48.73.240.1 0.0.0.3 area 0        ! g3/0 - route for AS 17390
 no passive-interface GigabitEthernet1/0   ! unlock OSPF on g1/0
 no passive-interface GigabitEthernet2/0   ! unlock OSPF on g2/0
!
! ==============================================================================
!                                   BGP
! ==============================================================================
!
router bgp 1273
 no synchronization
 bgp log-neighbor-changes
 ! iBGP -------------------------------
 neighbor 10.2.2.2 remote-as 1273
 neighbor 10.2.2.2 update-source Loopback0
 neighbor 10.2.2.2 next-hop-self
 neighbor 10.2.2.2 soft-reconfiguration-inbound
 neighbor 10.3.3.3 remote-as 1273
 neighbor 10.3.3.3 update-source Loopback0
 neighbor 10.3.3.3 next-hop-self
 neighbor 10.3.3.3 soft-reconfiguration-inbound
 ! eBGP -------------------------------
 neighbor 130.41.46.88 remote-as 17390
 neighbor 130.41.46.88 soft-reconfiguration-inbound
 no auto-summary
!
end



























