! ==============================================================================
!
!                          AS 1273 - Vodafone - R3
!
! ==============================================================================
!
hostname R3
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.3.3.3 255.255.255.255
!
interface Loopback1
 ip address 48.73.239.33 255.255.255.255
!
interface GigabitEthernet1/0
 ip address 10.3.4.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 ip address 10.1.3.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet3/0
 ip address 10.3.5.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet4/0
 ip address 48.73.240.5 255.255.255.252
 no shutdown
!
! ==============================================================================
!                                  OSPF
! ==============================================================================
!
router ospf 1
 router-id 10.3.3.3
 passive-interface default             ! block all interfaces from talk OSPF
 network 10.3.3.3 0.0.0.0 area 0       ! Lo0
 network 48.73.239.33 0.0.0.0 area 0   ! Lo1
 network 10.3.4.1 0.0.0.0 area 0       ! g1/0 -> R4
 network 10.1.3.2 0.0.0.0 area 0       ! g2/0 -> R1
 network 10.3.5.1 0.0.0.0 area 0       ! g3/0 -> R5
 network 48.73.240.5 0.0.0.3 area 0    ! g4/0 - route to AS 17390

 ! activate internal interfaces to establish adjacencies
 no passive-interface GigabitEthernet1/0
 no passive-interface GigabitEthernet2/0
 no passive-interface GigabitEthernet3/0
!
! ==============================================================================
!                                   BGP
! ==============================================================================
!
router bgp 1273
 bgp cluster-id 1.1.1.1
 no synchronization
 bgp log-neighbor-changes
 ! iBGP -------------------------------
 neighbor 10.1.1.1 remote-as 1273
 neighbor 10.1.1.1 update-source Loopback0
 neighbor 10.1.1.1 next-hop-self
 neighbor 10.1.1.1 route-reflector-client
 neighbor 10.1.1.1 soft-reconfiguration-inbound
 neighbor 10.4.4.4 remote-as 1273
 neighbor 10.4.4.4 update-source Loopback0
 neighbor 10.4.4.4 next-hop-self
 neighbor 10.4.4.4 route-reflector-client
 neighbor 10.4.4.4 soft-reconfiguration-inbound
 neighbor 10.5.5.5 remote-as 1273
 neighbor 10.5.5.5 update-source Loopback0
 neighbor 10.5.5.5 next-hop-self
 neighbor 10.5.5.5 route-reflector-client
 neighbor 10.5.5.5 soft-reconfiguration-inbound
 ! eBGP -------------------------------
 neighbor 130.41.46.77 remote-as 17390
 neighbor 130.41.46.77 soft-reconfiguration-inbound
 no auto-summary
end
