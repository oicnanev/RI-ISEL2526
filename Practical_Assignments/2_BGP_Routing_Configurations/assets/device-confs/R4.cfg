! ==============================================================================
!
!                          AS 1273 - Vodafone - R4
!
! ==============================================================================
!
hostname R4
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.4.4.4 255.255.255.255
!
interface Loopback1
 ip address 48.73.239.44 255.255.255.255
!
interface GigabitEthernet1/0
 ip address 10.3.4.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 ip address 10.2.4.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet3/0
 ip address 10.4.6.1 255.255.255.252
 no shutdown
!
! ==============================================================================
!                                    OSPF
! ==============================================================================
!
router ospf 1
 router-id 10.4.4.4
 network 10.4.4.4 0.0.0.0 area 0       ! Lo0
 network 48.73.239.44 0.0.0.0 area 0   ! Lo1
 network 10.3.4.2 0.0.0.0 area 0       ! g1/0 -> R3
 network 10.2.4.2 0.0.0.0 area 0       ! g2/0 -> R2
 network 10.4.6.1 0.0.0.0 area 0       ! g3/0 -> R6
 ! Block Loopbacks from talking OSPF
 passive-interface Loopback0
 passive-interface Loopback1
!
! ==============================================================================
!                                   BGP
! ==============================================================================
!
router bgp 1273
 bgp cluster-id 1.1.1.1
 no synchronization
 bgp log-neighbor-changes
 ! iBGP -------------------------------
 neighbor 10.2.2.2 remote-as 1273
 neighbor 10.2.2.2 update-source Loopback0
 neighbor 10.2.2.2 next-hop-self
 neighbor 10.2.2.2 route-reflector-client
 neighbor 10.2.2.2 soft-reconfiguration-inbound
 neighbor 10.3.3.3 remote-as 1273
 neighbor 10.3.3.3 update-source Loopback0
 neighbor 10.3.3.3 next-hop-self
 neighbor 10.3.3.3 route-reflector-client
 neighbor 10.3.3.3 soft-reconfiguration-inbound
 neighbor 10.6.6.6 remote-as 1273
 neighbor 10.6.6.6 update-source Loopback0
 neighbor 10.6.6.6 next-hop-self
 neighbor 10.6.6.6 route-reflector-client
 neighbor 10.6.6.6 soft-reconfiguration-inbound
!
end
