! ==============================================================================
!
!                              AS 17390 - IBM - R8
!
! ==============================================================================
!
hostname R8
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.8.8.8 255.255.255.255
!
interface Loopback1
 ip address 130.41.46.88 255.255.255.255
!
interface fastEthernet0/0
 ip address 130.41.46.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 ip address 10.7.8.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet4/0
 ip address 48.73.240.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet5/0
 ip address 130.41.46.2 255.255.255.252
 no shutdown
!
! ==============================================================================
!                                    OSPF
! ==============================================================================
!
router ospf 1
 router-id 10.8.8.8
 passive-interface default               ! block all interfaces from talk OSPF
 network 10.8.8.8 0.0.0.0 area 0         ! Lo0
 network 130.41.46.88 0.0.0.0 area 0     ! Lo1
 network 130.41.46.5 0.0.0.3 area 0      ! fa0/0 - Route to AS 64513 (private)
 network 10.7.8.2 0.0.0.0 area 0         ! g1/0 -> R7
 network 48.73.240.2 0.0.0.3 area 0      ! g4/0 - Route to AS 1273
 network 130.41.46.2 0.0.0.3 area 0      ! g5/0 -> Server1
 no passive-interface GigabitEthernet1/0 ! Unlock interface to run OSPF
!
! ==============================================================================
!                               STATIC ROUTES
! ==============================================================================
!
ip route 130.41.46.0 255.255.255.0 Null0
!
! ==============================================================================
!                                   BGP
! ==============================================================================
!
router bgp 17390
 no synchronization
 bgp log-neighbor-changes
 ! iBGP -------------------------------
 neighbor 10.7.7.7 remote-as 17390
 neighbor 10.7.7.7 update-source Loopback0
 neighbor 10.7.7.7 next-hop-self
 neighbor 10.7.7.7 soft-reconfiguration-inbound
 ! eBGP -------------------------------
 neighbor 130.41.47.99 remote-as 64513
 neighbor 130.41.47.99 soft-reconfiguration-inbound
 no auto-summary
 neighbor 48.73.239.11 remote-as 1273
 neighbor 48.73.239.11 soft-reconfiguration-inbound
 no auto-summary
!
end
