! ==============================================================================
!
!                          AS 1273 - Vodafone - R6
!
! ==============================================================================
!
hostname R6
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.6.6.6 255.255.255.255
!
interface Loopback1
 ip address 48.73.239.66 255.255.255.255
!
interface fastEthernet0/0
 ip address 48.73.240.17 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 ip address 48.73.240.13 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 ip address 48.73.240.21 255.255.255.252
 no shutdown
!
interface GigabitEthernet3/0
 ip address 10.4.6.2 255.255.255.252
 no shutdown
!
! ==============================================================================
!                                    OSPF
! ==============================================================================
!
router ospf 1
 router-id 10.6.6.6
 passive-interface default               ! block all interfaces from talk OSPF
 network 10.6.6.6 0.0.0.0 area 0         ! Lo0
 network 48.73.239.66 0.0.0.0 area 0     ! Lo1
 network 48.73.240.17 0.0.0.3 area 0     ! fa0/0 - Route to AS 5511
 network 48.73.240.13 0.0.0.3 area 0     ! g1/0  - Route to AS 4637
 network 48.73.240.21 0.0.0.3 area 0     ! g2/0  - Route to AS 20717
 network 10.4.6.2 0.0.0.0 area 0         ! g3/0 -> R4
 no passive-interface GigabitEthernet3/0 ! unlock OSPF on g3/0
!
! ==============================================================================
!                               STATIC ROUTES
! ==============================================================================
!
ip route 48.73.239.0 255.255.255.0 Null0
ip route 48.73.240.0 255.255.252.0 Null0
ip route 63.25.64.0 255.255.192.0 Null0
! 
! ==============================================================================
!                                   BGP
! ==============================================================================
!
router bgp 1273
 no synchronization
 bgp log-neighbor-changes
 ! iBGP -------------------------------
 neighbor 10.4.4.4 remote-as 1273
 neighbor 10.4.4.4 update-source Loopback0
 neighbor 10.4.4.4 next-hop-self
 neighbor 10.4.4.4 soft-reconfiguration-inbound
 ! eBGP -------------------------------
 neighbor 211.176.128.115 remote-as 4637
 neighbor 211.176.128.115 soft-reconfiguration-inbound
 neighbor 48.73.240.22 remote-as 20717    ! Não tem Lo1 !!!!
 neighbor 48.73.240.22 soft-reconfiguration-inbound
 neighbor 46.87.162.110 remote-as 5511. ! falta a g5/0 do outro lado
 neighbor 46.87.162.110 soft-reconfiguration-inbound
 ! Advertise Routes -------------------
 network 48.73.239.0 mask 255.255.255.0
 network 48.73.240.0 mask 255.255.252.0
 network 63.25.64.0 mask 255.255.292.0
 no auto-summary
!
end
