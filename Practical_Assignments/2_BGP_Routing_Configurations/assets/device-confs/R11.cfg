! ==============================================================================
!
!                            AS 5511 - Orange - R11
!
! ==============================================================================
!
hostname R11
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.11.11.11 255.255.255.255
!
interface Loopback1
 ip address 46.87.162.111 255.255.255.255
!
interface fastEthernet0/0
 ip address 46.88.20.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 ip address 10.10.11.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 ip address 10.11.12.1 255.255.255.252
 no shutdown
!
! ==============================================================================
!                                    OSPF
! ==============================================================================
!
router ospf 1
 router-id 10.11.11.11
 !passive-interface Loopback0               
 network 10.10.11.0 0.0.0.3 area 0    ! R10
 network 10.11.12.0 0.0.0.3 area 1    ! R12
 network 10.11.11.11 0.0.0.0 area 0   ! Lo0
 area 1 stub       
 log-adjacency-changes
!
! ==============================================================================
!                               STATIC ROUTES
! ==============================================================================
!
ip route 46.87.162.0 255.255.255.0 Null0
ip route 46.88.20.0 255.255.255.0 Null0
ip route 46.88.22.0 255.255.255.0 Null0
ip route 46.89.36.0 255.255.255.0 Null0
ip route 46.89.38.0 255.255.255.0 Null0
ip route 46.92.2.0 255.255.255.0 Null0
!
! ==============================================================================
!                                   BGP
! ==============================================================================
!
router bgp 5511
 bgp router-id 10.11.11.11
 no synchronization
 bgp log-neighbor-changes
 ! iBGP -------------------------------
 neighbor 10.10.10.10 remote-as 5511
 neighbor 10.10.10.10 update-source Loopback0
 neighbor 10.10.10.10 next-hop-self
 neighbor 10.10.10.10 soft-reconfiguration inbound
 neighbor 10.11.11.12 remote-as 5511
 neighbor 10.11.11.12 update-source Loopback0
 neighbor 10.11.11.12 next-hop-self
 neighbor 10.11.11.12 soft-reconfiguration inbound
 ! eBGP -------------------------------
 neighbor 46.88.20.6 remote-as 23344                 
 neighbor 46.88.20.6 soft-reconfiguration inbound
 ! Advertise Routes -------------------
 network 46.87.162.111 mask 255.255.255.255     ! Lo1
 network 46.87.162.0 mask 255.255.255.0
 network 46.87.162.0 mask 255.255.255.252      ! Avoid black-hole, access server5
 network 46.87.162.112 mask 255.255.255.255    ! for router 12
 network 46.88.20.0 mask 255.255.255.0
 network 46.88.20.0 mask 255.255.255.252 
 network 46.88.22.0 mask 255.255.255.0
 network 46.88.22.0 mask 255.255.255.252
 network 46.89.36.0 mask 255.255.255.0
 network 46.89.36.0 mask 255.255.255.252
 network 46.89.38.0 mask 255.255.255.0
 network 46.89.38.0 mask 255.255.255.252
 network 46.92.2.0 mask 255.255.255.0
 network 46.92.2.0 mask 255.255.255.252
 no auto-summary
end
