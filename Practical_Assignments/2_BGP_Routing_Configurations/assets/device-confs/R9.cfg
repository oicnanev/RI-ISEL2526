! ==============================================================================
!
!                          AS 64513 (Private AS) - R9
!
! ==============================================================================
!
hostname R9
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.9.9.9 255.255.255.255
!
interface Loopback1
 ip address 130.41.47.99 255.255.255.255
!
interface fastEthernet0/0
 ip address 130.41.46.10 255.255.255.252
 no shutdown
!
interface fastEthernet1/0
 ip address 130.41.46.6 255.255.255.252
 no shutdown
!
!
! ==============================================================================
!                               STATIC ROUTES
! ==============================================================================
!
ip route 130.41.47.0 255.255.255.0 Null0
!
! ==============================================================================
!                                   BGP
! ==============================================================================
!
!
router bgp 64513
 no synchronization
 bgp log-neighbor-changes
 ! eBGP -------------------------------
 neighbor 130.41.46.77 remote-as 17390
 neighbor 130.41.46.77 soft-reconfiguration-inbound
 no auto-summary
 neighbor 130.41.46.88 remote-as 17390
 neighbor 130.41.46.88 soft-reconfiguration-inbound
 no auto-summary
end
