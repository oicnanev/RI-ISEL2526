! ==============================================================================
!
!                           AS 20717 - DE-CIX - R16
!
! ==============================================================================
!
hostname R16
!
! ==============================================================================
!                                IP Addressing
! ==============================================================================
!
interface Loopback0
 ip address 10.16.16.16 255.255.255.255
!
interface GigabitEthernet2/0
 ip address 48.73.240.22 255.255.255.252
 no shutdown
!
interface GigabitEthernet4/0
 ip address 48.88.20.2 255.255.255.252
 no shutdown
!
! ==============================================================================
!                                   BGP
! ==============================================================================
!
router bgp 20717
 no synchronization
 bgp log-neighbor-changes
 ! eBGP -------------------------------
 neighbor 48.73.239.66 remote-as 1273                 
 neighbor 48.73.239.66 soft-reconfiguration-inbound
 no auto-summary
 neighbor 46.87.162.110 remote-as 5511                 
 neighbor 46.87.162.110 soft-reconfiguration-inbound
 no auto-summary
!
end
